name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  windows-installer:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build app folder (embedded Python)
        run: powershell -ExecutionPolicy Bypass -File packaging\windows\build.ps1
      - name: Smoke test the packaged app (like on a user's PC)
        shell: pwsh
        run: |
          $env:ABYDEX_HOME = "$env:RUNNER_TEMP\abydex-home"
          $env:ABYDEX_NO_UPDATE_CHECK = "1"
          $cli = "$PWD\build\app\bin\abydex.cmd"
          & $cli doctor; if ($LASTEXITCODE) { exit 1 }
          & "$PWD\build\app\python\python.exe" -c "import webview; print('pywebview OK')"; if ($LASTEXITCODE) { exit 1 }
          & $cli text "cutie 80x50x30 cu capac" -p bambu_a1 -m pla --no-llm; if ($LASTEXITCODE) { exit 1 }
          $p = Start-Process -PassThru -NoNewWindow "$PWD\build\app\python\python.exe" -ArgumentList "-m","abydex","ui","--no-browser","--port","8799"
          $ok = $false
          foreach ($i in 1..30) {
            Start-Sleep 1
            try {
              $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8799/api/catalog
              Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8799/ | Out-Null
              Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8799/static/app.js | Out-Null
              if ($r.Content -match "bambu_a1") { $ok = $true; break }
            } catch {}
          }
          Stop-Process -Id $p.Id -Force
          if (-not $ok) { Write-Error "UI did not start"; exit 1 }
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build installer
        shell: pwsh
        run: |
          $v = python -c "import abydex; print(abydex.__version__)"
          $n = ($v -split '-')[0]
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" "/DNumVersion=$n" packaging\windows\Abydex.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*.exe

  linux-package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel + Linux bundle
        run: |
          python -m pip install build
          python -m build
          V=$(python -c "import abydex; print(abydex.__version__)")
          mkdir -p bundle/abydex-$V
          git archive HEAD | tar -x -C bundle/abydex-$V
          tar -czf dist/abydex-$V-linux.tar.gz -C bundle abydex-$V
          # smoke test the installer script
          ABYDEX_SRC="$PWD" bash packaging/linux/install.sh
          ~/.local/bin/abydex --version
      - uses: actions/upload-artifact@v4
        with:
          name: linux-and-wheel
          path: |
            dist/*.whl
            dist/*.tar.gz

  # Publishes a release when:
  #  - a tag vX.Y.Z is pushed, or
  #  - main is pushed with a version (abydex/__init__.py) that has no release yet
  #    -> the tag is created automatically, no manual tagging needed.
  release:
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    needs: [windows-installer, linux-package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version, release notes, skip if already released
        id: meta
        run: |
          VER=$(python3 -c "import abydex; print(abydex.__version__)")
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$VER" ]; then
            echo "Tag ${GITHUB_REF_NAME} != __version__ $VER"; exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "branch" ] && git ls-remote --exit-code --tags origin "refs/tags/v$VER" >/dev/null; then
            echo "v$VER is already released - nothing to do"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          python3 scripts/release.py --notes "$VER" > notes.md
          case "$VER" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT";; *) echo "prerelease=false" >> "$GITHUB_OUTPUT";; esac
      - uses: actions/download-artifact@v4
        if: steps.meta.outputs.skip == 'false'
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums (verified by the in-app updater)
        if: steps.meta.outputs.skip == 'false'
        run: cd artifacts && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        if: steps.meta.outputs.skip == 'false'
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Abydex v${{ steps.meta.outputs.version }}
          body_path: notes.md
          prerelease: ${{ steps.meta.outputs.prerelease }}
          files: artifacts/*

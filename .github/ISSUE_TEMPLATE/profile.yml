name: Profil material / imprimantă
description: Propune sau corectează setări testate
labels: [profile]
body:
  - type: input
    id: printer
    attributes: { label: Imprimantă, placeholder: "ex: Bambu Lab A1, duza 0.4" }
    validations: { required: true }
  - type: input
    id: material
    attributes: { label: Material + producător, placeholder: "ex: ASA, Polymaker" }
    validations: { required: true }
  - type: textarea
    id: settings
    attributes: { label: Setări care au mers, description: "Temperaturi, ventilator, retracție, flow, alte observații" }
    validations: { required: true }
  - type: textarea
    id: result
    attributes: { label: Rezultat, description: Poze sau descriere }
